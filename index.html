<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Asistente Spotify Desktop</title>
<style>
  :root{
    --bg:#121212;
    --bg-elev:#181818;
    --bg-bot:#242424;
    --green:#1DB954;
    --green-bright:#1ed760;
    --text:#ffffff;
    --text-soft:#b3b3b3;
    --border:#2a2a2a;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{
    font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif;
    background:radial-gradient(circle at 50% -10%, #1f1f1f 0%, var(--bg) 55%);
    color:var(--text);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:16px;
    min-height:100vh;
  }
  .app{
    width:100%;
    max-width:480px;
    height:min(88vh,720px);
    background:var(--bg-elev);
    border-radius:18px;
    box-shadow:0 24px 60px rgba(0,0,0,.55);
    display:flex;
    flex-direction:column;
    overflow:hidden;
    border:1px solid var(--border);
  }
  /* Header */
  header{
    display:flex;
    align-items:center;
    gap:12px;
    padding:16px 18px;
    background:linear-gradient(135deg,#0a0a0a,#1a1a1a);
    border-bottom:1px solid var(--border);
  }
  .logo{
    width:42px;height:42px;border-radius:50%;
    background:var(--green);
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
  }
  .logo svg{width:26px;height:26px;}
  .head-text h1{font-size:1.02rem;font-weight:700;letter-spacing:.2px;}
  .head-text p{font-size:.74rem;color:var(--green-bright);display:flex;align-items:center;gap:6px;margin-top:2px;}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--green-bright);box-shadow:0 0 6px var(--green-bright);}

  /* Chat area */
  .chat{
    flex:1;
    overflow-y:auto;
    padding:18px 16px 8px;
    display:flex;
    flex-direction:column;
    gap:12px;
    scroll-behavior:smooth;
  }
  .chat::-webkit-scrollbar{width:8px;}
  .chat::-webkit-scrollbar-thumb{background:#3a3a3a;border-radius:8px;}

  .row{display:flex;gap:8px;max-width:88%;animation:pop .28s ease;}
  .row.bot{align-self:flex-start;}
  .row.user{align-self:flex-end;flex-direction:row-reverse;}
  @keyframes pop{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}

  .avatar{
    width:30px;height:30px;border-radius:50%;flex-shrink:0;
    background:var(--green);display:flex;align-items:center;justify-content:center;
    margin-top:2px;
  }
  .avatar svg{width:18px;height:18px;}

  .bubble{
    padding:11px 14px;
    border-radius:16px;
    font-size:.9rem;
    line-height:1.45;
    white-space:pre-wrap;
    word-wrap:break-word;
  }
  .bot .bubble{background:var(--bg-bot);border-top-left-radius:4px;color:#ececec;}
  .user .bubble{background:var(--green);color:#06250f;border-top-right-radius:4px;font-weight:500;}
  .bubble b{color:var(--green-bright);font-weight:700;}
  .bubble .step{display:block;margin:3px 0;}
  .bubble a{color:var(--green-bright);}
  .bubble .note{display:block;margin-top:8px;font-size:.8rem;color:var(--text-soft);border-left:2px solid var(--green);padding-left:8px;}

  /* typing */
  .typing{display:flex;gap:4px;padding:14px;}
  .typing span{width:7px;height:7px;border-radius:50%;background:var(--text-soft);animation:blink 1.2s infinite;}
  .typing span:nth-child(2){animation-delay:.2s;}
  .typing span:nth-child(3){animation-delay:.4s;}
  @keyframes blink{0%,60%,100%{opacity:.25;}30%{opacity:1;}}

  /* quick replies */
  .quick{
    display:flex;flex-wrap:wrap;gap:8px;
    padding:8px 16px 4px;
  }
  .quick button{
    background:transparent;
    border:1px solid #3a3a3a;
    color:#e6e6e6;
    padding:7px 13px;
    border-radius:20px;
    font-size:.8rem;
    cursor:pointer;
    transition:all .18s ease;
    font-family:inherit;
  }
  .quick button:hover{border-color:var(--green);color:var(--green-bright);transform:translateY(-1px);}

  /* input */
  .input-bar{
    display:flex;gap:10px;align-items:center;
    padding:12px 14px 16px;
    border-top:1px solid var(--border);
    background:var(--bg-elev);
  }
  .input-bar input{
    flex:1;
    background:#2a2a2a;
    border:1px solid transparent;
    border-radius:24px;
    padding:12px 16px;
    color:var(--text);
    font-size:.9rem;
    outline:none;
    font-family:inherit;
    transition:border .18s;
  }
  .input-bar input:focus{border-color:var(--green);}
  .input-bar input::placeholder{color:#777;}
  .send{
    width:44px;height:44px;border-radius:50%;border:none;
    background:var(--green);cursor:pointer;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    transition:transform .15s, background .15s;
  }
  .send:hover{background:var(--green-bright);transform:scale(1.06);}
  .send svg{width:20px;height:20px;}
</style>
</head>
<body>
  <div class="app">
    <header>
      <div class="logo">
        <svg viewBox="0 0 24 24" fill="#000"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.586 14.424a.624.624 0 0 1-.857.207c-2.348-1.435-5.304-1.76-8.785-.964a.624.624 0 1 1-.277-1.216c3.809-.871 7.077-.496 9.712 1.115a.623.623 0 0 1 .207.858zm1.223-2.722a.78.78 0 0 1-1.072.257c-2.687-1.652-6.785-2.131-9.965-1.166a.78.78 0 1 1-.452-1.493c3.632-1.102 8.147-.568 11.232 1.328a.78.78 0 0 1 .257 1.074zm.105-2.835C14.692 8.95 9.375 8.775 6.297 9.71a.935.935 0 1 1-.542-1.79c3.532-1.072 9.404-.865 13.115 1.338a.936.936 0 0 1-.957 1.609z"/></svg>
      </div>
      <div class="head-text">
        <h1>Asistente Spotify Desktop</h1>
        <p><span class="dot"></span> En línea · respondo tus dudas del manual</p>
      </div>
    </header>

    <div class="chat" id="chat"></div>

    <div class="quick" id="quick"></div>

    <div class="input-bar">
      <input id="input" type="text" placeholder="Escribe tu pregunta..." autocomplete="off">
      <button class="send" id="send" aria-label="Enviar">
        <svg viewBox="0 0 24 24" fill="#06250f"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </div>
  </div>

<script>
/* ============================================================
   BASE DE CONOCIMIENTO (sin IA, basada en palabras clave)
   Cada intent tiene: keywords + respuesta tomada del manual
   ============================================================ */
const KB = [
  {
    id:"crear_cuenta",
    keywords:["crear cuenta","cuenta","registrarme","registrar","registro","registrate","regístrate","sign up","correo","email","contraseña","password"],
    title:"Crear una cuenta de Spotify",
    answer:
`<b>📝 Crear una cuenta de Spotify</b>
<span class="step">✅ Necesitas un correo electrónico válido.</span>
<span class="step">1️⃣ Entra a <a href="https://open.spotify.com/" target="_blank">open.spotify.com</a></span>
<span class="step">2️⃣ Haz clic en <b>"Regístrate"</b> (esquina superior derecha).</span>
<span class="step">3️⃣ Escribe tu correo y presiona <b>"Next"</b>.</span>
<span class="step">4️⃣ Crea una contraseña de <b>mínimo 10 caracteres</b>, con al menos una letra y un número o carácter especial.</span>
<span class="step">5️⃣ Presiona "Next", completa el formulario con tus datos.</span>
<span class="step">6️⃣ Acepta los términos y haz clic en <b>"Sign Up"</b>.</span>
<span class="note">❗ Tus datos se almacenan en los servidores de Spotify.</span>`
  },
  {
    id:"descargar",
    keywords:["descarg","bajar","bajo la app","download","instalador","obtener app","conseguir la app","instalar aplicacion","instalar aplicación"],
    title:"Descargar la app de escritorio",
    answer:
`<b>⬇️ Descargar Spotify Desktop</b>
<span class="step">✅ Necesitas internet, al menos <b>1 GB</b> de disco y <b>512 MB</b> de RAM.</span>
<span class="step">1️⃣ Entra a <a href="https://open.spotify.com/" target="_blank">open.spotify.com</a></span>
<span class="step">2️⃣ Haz clic en <b>"Instalar aplicación"</b>.</span>
<span class="step">3️⃣ Elige la carpeta de descarga y presiona <b>"Save"</b>.</span>
<span class="step">4️⃣ Espera a que termine de descargarse el archivo.</span>`
  },
  {
    id:"instalar",
    keywords:["instalar","instalacion","instalación","ejecutar","setup","spotifysetup",".exe","como instalo"],
    title:"Instalar la app de escritorio",
    answer:
`<b>⚙️ Instalar Spotify Desktop</b>
<span class="step">✅ Necesitas el instalador descargado y al menos <b>512 MB</b> de RAM.</span>
<span class="step">1️⃣ Haz clic en el archivo descargado (SpotifySetup.exe) para ejecutarlo.</span>
<span class="step">2️⃣ Espera a que termine la descarga.</span>
<span class="step">3️⃣ Espera a que termine la instalación.</span>
<span class="step">4️⃣ Presiona el icono de Spotify en la barra de tareas.</span>
<span class="step">5️⃣ Espera a que se maximice la aplicación.</span>
<span class="note">❗ Aparecerá un icono en el escritorio y se ejecutará al iniciar la PC.</span>`
  },
  {
    id:"crear_playlist",
    keywords:["crear playlist","crear una playlist","creo una playlist","creo playlist","crear lista","nueva playlist","hacer playlist","hago una playlist","armar playlist","lista de reproduccion","lista de reproducción","boton crear","botón crear"],
    title:"Crear una playlist",
    answer:
`<b>🎵 Crear una playlist</b>
<span class="step">✅ Necesitas una cuenta activa y acceso a internet.</span>
<span class="step">1️⃣ Abre la aplicación de Spotify.</span>
<span class="step">2️⃣ Presiona el botón <b>"Crear"</b> (esquina superior izquierda).</span>
<span class="step">3️⃣ Presiona el botón <b>"Playlist"</b>.</span>
<span class="note">❗ Se creará una playlist asociada a tu cuenta.</span>`
  },
  {
    id:"agregar_canciones",
    keywords:["agreg","añad","anad","sumar cancion","sumar canción","poner cancion","poner canción","canciones a la playlist","canciones a mi playlist","buscar cancion","buscar canción","boton +","botón +"],
    title:"Agregar canciones a la playlist",
    answer:
`<b>➕ Agregar canciones a una playlist</b>
<span class="step">✅ Necesitas una playlist creada, internet y cuenta de Spotify.</span>
<span class="step">1️⃣ Abre la aplicación de Spotify.</span>
<span class="step">2️⃣ Presiona la barra de búsqueda.</span>
<span class="step">3️⃣ Escribe el nombre de la canción deseada.</span>
<span class="step">4️⃣ Presiona la canción que quieras.</span>
<span class="step">5️⃣ Presiona dos veces el botón <b>"+"</b> a la derecha de la canción.</span>
<span class="step">6️⃣ En el menú, selecciona la playlist deseada.</span>
<span class="step">7️⃣ Presiona <b>"Listo"</b>.</span>`
  },
  {
    id:"requisitos",
    keywords:["requisitos","ram","memoria","disco","espacio","cuanto pesa","cuánto pesa","gb","mb","necesito"],
    title:"Requisitos del sistema",
    answer:
`<b>💻 Requisitos</b>
<span class="step">• Para <b>descargar</b>: internet, al menos 1 GB de disco y 512 MB de RAM.</span>
<span class="step">• Para <b>instalar</b>: el instalador descargado y al menos 512 MB de RAM.</span>
<span class="step">• Para <b>crear cuenta / playlist</b>: un correo válido y acceso a internet.</span>`
  },
  {
    id:"version",
    keywords:["version","versión","que version","qué versión"],
    title:"Versión del manual",
    answer:`<b>ℹ️ Versión</b>\nEste manual fue desarrollado con la versión <b>1.2.90.451.gb094aab0</b> de Spotify.`
  },
  {
    id:"saludo",
    keywords:["hola","buenas","buenos dias","buenos días","buenas tardes","que tal","qué tal","hey","saludos"],
    title:"Saludo",
    answer:`¡Hola! 👋 Soy el asistente del <b>Manual de Spotify Desktop</b>. Puedo ayudarte a crear tu cuenta, descargar e instalar la app, o armar tus playlists. ¿Con qué empezamos?`
  },
  {
    id:"gracias",
    keywords:["gracias","muchas gracias","genial","perfecto","buenisimo","buenísimo"],
    title:"Agradecimiento",
    answer:`¡De nada! 🎧 Si tenés otra duda del manual, acá estoy.`
  }
];

/* Quick replies que se muestran al inicio */
const QUICK = [
  {label:"Crear cuenta", q:"Quiero crear una cuenta"},
  {label:"Descargar app", q:"Quiero descargar la app"},
  {label:"Instalar app", q:"Quiero instalar la app"},
  {label:"Crear playlist", q:"Quiero crear una playlist"},
  {label:"Agregar canciones", q:"Quiero agregar canciones"},
  {label:"Requisitos", q:"¿Qué requisitos necesito?"}
];

/* ---------- Normalización y matching ---------- */
function normalize(str){
  return str.toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"") // quita acentos
    .replace(/[¿?¡!.,;:]/g,"")
    .trim();
}

function findIntent(text){
  const t = normalize(text);
  let best = null, bestScore = 0;
  for(const intent of KB){
    let score = 0;
    for(const kw of intent.keywords){
      const k = normalize(kw);
      if(t.includes(k)){
        score += k.split(" ").length; // frases más largas pesan más
      }
    }
    if(score > bestScore){ bestScore = score; best = intent; }
  }
  return bestScore > 0 ? best : null;
}

const FALLBACK =
`🤔 No encontré eso en el manual. Puedo ayudarte con:
<span class="step">• Crear una cuenta de Spotify</span>
<span class="step">• Descargar la app de escritorio</span>
<span class="step">• Instalar la app</span>
<span class="step">• Crear una playlist</span>
<span class="step">• Agregar canciones a una playlist</span>
<span class="step">• Requisitos del sistema</span>
Probá con alguno de los botones de abajo. 👇`;

/* ---------- UI ---------- */
const chat = document.getElementById("chat");
const input = document.getElementById("input");
const sendBtn = document.getElementById("send");
const quickWrap = document.getElementById("quick");

const BOT_SVG = '<svg viewBox="0 0 24 24" fill="#000"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.586 14.424a.624.624 0 0 1-.857.207c-2.348-1.435-5.304-1.76-8.785-.964a.624.624 0 1 1-.277-1.216c3.809-.871 7.077-.496 9.712 1.115a.623.623 0 0 1 .207.858zm1.223-2.722a.78.78 0 0 1-1.072.257c-2.687-1.652-6.785-2.131-9.965-1.166a.78.78 0 1 1-.452-1.493c3.632-1.102 8.147-.568 11.232 1.328a.78.78 0 0 1 .257 1.074z"/></svg>';

function addUser(text){
  const row = document.createElement("div");
  row.className = "row user";
  row.innerHTML = `<div class="bubble"></div>`;
  row.querySelector(".bubble").textContent = text;
  chat.appendChild(row);
  scroll();
}

function addBot(html){
  const row = document.createElement("div");
  row.className = "row bot";
  row.innerHTML = `<div class="avatar">${BOT_SVG}</div><div class="bubble">${html}</div>`;
  chat.appendChild(row);
  scroll();
}

function showTyping(){
  const row = document.createElement("div");
  row.className = "row bot";
  row.id = "typing";
  row.innerHTML = `<div class="avatar">${BOT_SVG}</div><div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>`;
  chat.appendChild(row);
  scroll();
}
function removeTyping(){ const t=document.getElementById("typing"); if(t) t.remove(); }

function scroll(){ chat.scrollTop = chat.scrollHeight; }

function botReply(text){
  showTyping();
  setTimeout(()=>{
    removeTyping();
    const intent = findIntent(text);
    addBot(intent ? intent.answer : FALLBACK);
  }, 550);
}

function handleSend(text){
  const msg = (text ?? input.value).trim();
  if(!msg) return;
  addUser(msg);
  input.value = "";
  botReply(msg);
}

sendBtn.addEventListener("click", ()=>handleSend());
input.addEventListener("keydown", e=>{ if(e.key==="Enter") handleSend(); });

QUICK.forEach(q=>{
  const b = document.createElement("button");
  b.textContent = q.label;
  b.onclick = ()=>handleSend(q.q);
  quickWrap.appendChild(b);
});

/* Mensaje de bienvenida */
window.addEventListener("load", ()=>{
  setTimeout(()=>addBot(`¡Hola! 👋 Soy el asistente del <b>Manual de Spotify Desktop</b>.\nPreguntame lo que necesites o usá los botones de abajo para empezar. 🎧`), 300);
});
</script>
</body>
</html>
